name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Ingest artist "..."
        2. Open the artist page
        3. ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Backend, Frontend, MCP server, Docs, Not sure]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or error output
      description: Remove any API keys, database URLs or tokens before pasting.
      render: shell
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: OS, Python version, Node version, browser
